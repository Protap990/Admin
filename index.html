<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin: washroom listings</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F2F7F7;--card:#fff;--ink:#12303A;--mute:#5B7480;--line:#CFE0E3;--acc:#13767F;--accink:#fff;--gold:#F2A93B;--err:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1E24;--card:#16303A;--ink:#E6F2F4;--mute:#9DB6BE;--line:#2A4852;--acc:#4DC0CB;--accink:#06262B;--err:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Mukta,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.1;font-weight:800;margin:8px 0}
[hidden]{display:none!important}
.box,.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--accink);cursor:pointer}
button.full{width:100%;margin-top:16px;padding:14px}
button.no{background:transparent;color:var(--err);border:1.5px solid var(--err)}
button.out{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top small{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--mute)}
.stat b{display:block;font-size:22px;color:var(--ink)}
.bar{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:12px}
.tag{display:inline-block;background:var(--gold);color:#3a2600;border-radius:6px;padding:0 8px;font-weight:600;font-size:14px;margin:4px 4px 0 0}
.tag.g{background:var(--acc);color:var(--accink)}.tag.r{background:var(--err);color:#fff}
.item h3{margin:0;font-size:19px}.item small{color:var(--mute);display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item a{color:var(--acc);font-weight:600}
.err{color:var(--err);min-height:1.2em;margin:8px 0 0}
.empty{color:var(--mute);border:1.5px dashed var(--line);border-radius:14px;padding:16px}
</style>
</head>
<body>
<main>
<h1>Admin: washroom listings</h1>

<div class="box" id="setup" hidden>
<strong>Setup needed</strong>
<p>Open this file, find <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the bottom, and paste the values from your Supabase project (Settings, then API). Then run <code>setup.sql</code> in the Supabase SQL editor.</p>
</div>

<form class="box" id="login" hidden>
<strong>Admin login</strong>
<label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<p class="err" id="loginErr" role="alert"></p>
<button class="full" type="submit">Log in</button>
</form>

<div id="dash" hidden>
<div class="top"><small>Signed in as <span id="who"></span></small><button class="out" id="out">Log out</button></div>
<div class="stats" id="stats"></div>
<div class="bar">
<select id="flt" aria-label="Filter by status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="suspended">Suspended</option><option value="all">All</option></select>
<input id="q" type="search" placeholder="Search name, phone, area, PIN">
</div>
<p class="err" id="msg" role="status"></p>
<div id="list"></div>
</div>
</main>

<script>
const SUPABASE_URL='https://uyypecjfolryxmrxyerj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5eXBlY2pmb2xyeXhtcnh5ZXJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDQ0MzQsImV4cCI6MjEwNjY4MDQzNH0.eKmcvnL_s29ulbi5_lLtMVUL0k2wxPqu-27404yoSTI'; // the anon key is meant to be public. NEVER paste the service_role key here.

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const db=SUPABASE_URL.startsWith('PASTE')?null:window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let all=[];

function show(v){['setup','login','dash'].forEach(x=>$(x).hidden=x!==v)}

async function boot(){
 if(!db){show('setup');return}
 const {data:{session}}=await db.auth.getSession();
 session?enter(session.user):show('login');
}
async function enter(user){
 const {data,error}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
 if(error||!data){await db.auth.signOut();show('login');$('loginErr').textContent='This account does not have admin access.';return}
 $('who').textContent=user.email;show('dash');load();
}
$('login').addEventListener('submit',async e=>{
 e.preventDefault();$('loginErr').textContent='';
 const {data,error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(error){$('loginErr').textContent='Wrong email or password.';return}
 $('pw').value='';enter(data.user);
});
$('out').addEventListener('click',async()=>{await db.auth.signOut();all=[];show('login')});

async function load(){
 $('msg').textContent='Loading...';
 const {data,error}=await db.from('listings').select('*').order('created_at',{ascending:false}).limit(500);
 if(error){$('msg').textContent='Could not load listings: '+error.message;return}
 all=data;$('msg').textContent='';render();
}

function card(l){
 const ok=l.kyc_verified;
 const map=(l.lat!=null&&l.lng!=null)?`<a href="https://www.google.com/maps/search/?api=1&query=${Number(l.lat)},${Number(l.lng)}" target="_blank" rel="noopener">View on Google Maps</a>`:'';
 const cls=l.status==='approved'?'g':(l.status==='pending'?'':'r');
 return `<div class="item">
 <h3>${esc(l.host_name)} <span class="tag ${cls}">${esc(l.status)}</span></h3>
 <small>${esc(l.phone)} · added ${new Date(l.created_at).toLocaleDateString('en-IN')}</small>
 <small>${esc(l.addr)}, ${esc(l.pin)} · ${esc(l.type)} · ${esc(l.open_time)}–${esc(l.close_time)}</small>
 <div><span class="tag">${esc(l.who)}</span>${(l.facilities||[]).map(f=>`<span class="tag">${esc(f)}</span>`).join('')}<span class="tag">₹${Number(l.price)}</span></div>
 <small>${ok?`ID verified: ${esc(l.id_type)} ending ${esc(l.id_last4)}`:'ID NOT verified yet'}</small>
 ${map}
 <div class="acts">
 <button data-act="approved" data-id="${esc(l.id)}" ${ok&&l.status!=='approved'?'':'disabled'} title="${ok?'':'Needs verified ID first'}">Approve</button>
 <button class="no" data-act="rejected" data-id="${esc(l.id)}" ${l.status==='rejected'?'disabled':''}>Reject</button>
 <button class="out" data-act="suspended" data-id="${esc(l.id)}" ${l.status==='approved'?'':'disabled'}>Suspend</button>
 </div></div>`;
}
function render(){
 const st=$('flt').value,q=$('q').value.trim().toLowerCase();
 const n={pending:0,approved:0,rejected:0,suspended:0};all.forEach(l=>{n[l.status]=(n[l.status]||0)+1});
 $('stats').innerHTML=Object.entries(n).map(([k,v])=>`<div class="stat"><b>${v}</b>${esc(k)}</div>`).join('');
 const rows=all.filter(l=>(st==='all'||l.status===st)&&(!q||[l.host_name,l.phone,l.addr,l.pin].join(' ').toLowerCase().includes(q)));
 $('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">No listings match.</div>';
}
$('flt').addEventListener('change',render);
$('q').addEventListener('input',render);
$('list').addEventListener('click',async e=>{
 const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
 if(!confirm('Mark this listing as '+b.dataset.act+'?'))return;
 b.disabled=true;
 const {error}=await db.from('listings').update({status:b.dataset.act}).eq('id',b.dataset.id);
 if(error)alert('Could not update: '+error.message);
 load();
});
boot();
</script>
</body>
</html>
